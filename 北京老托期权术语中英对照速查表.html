                // 添加点击事件
                row.addEventListener('click', () => {
                    const isOpen = !detailRow.classList.contains('hidden')

                    // 关闭所有其他详情行
                    document.querySelectorAll('[data-detail-for]').forEach(el => {
                        if (el.dataset.detailFor !== term.id) {
                            el.classList.add('hidden')
                            const otherRow = document.querySelector(`[data-id="${el.dataset.detailFor}"]`)
                            if (otherRow) {
                                otherRow.querySelector('.toggle-icon').classList.remove('rotate-180')
                            }
                        }
                    })

                    // 切换当前详情行
                    detailRow.classList.toggle('hidden', isOpen)
                    row.querySelector('.toggle-icon').classList.toggle('rotate-180', !isOpen)

                    // 如果打开了详情，滚动到可见位置
                    if (!isOpen) {
                        detailRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
                    }
                })

                // 添加到表格
                termsTable.appendChild(row)
                termsTable.appendChild(detailRow)
            })
        }

        // 搜索功能
        function filterTerms(query) {
            if (!query) return optionsTerms

            const lowerQuery = query.toLowerCase()
            return optionsTerms.filter(term =>
                term.english.toLowerCase().includes(lowerQuery) ||
                term.chinese.toLowerCase().includes(lowerQuery) ||
                term.abbr.toLowerCase().includes(lowerQuery) ||
                term.explanation.toLowerCase().includes(lowerQuery)
            )
        }

        // 搜索输入事件
        searchInput.addEventListener('input', (e) => {
            const filtered = filterTerms(e.target.value)
            renderTable(filtered)
        })

        // 返回顶部按钮
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.remove('opacity-0', 'invisible')
                backToTopBtn.classList.add('opacity-100', 'visible')
            } else {
                backToTopBtn.classList.remove('opacity-100', 'visible')
                backToTopBtn.classList.add('opacity-0', 'invisible')
            }
        })

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' })
        })

        renderTable(optionsTerms);
